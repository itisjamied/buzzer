<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Buzzer App</title>
    <style>
      /* General styles */
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    background-color: #111;
    color: #fff;
}

.page {
    display: none;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

.page.active {
    display: flex;
}

/* Button styles */
button {
    padding: 15px 25px;
    font-size: 16px;
    color: #fff;
    background-color: #007bff;
    border: none;
    border-radius: 25px;
    cursor: pointer;
    margin: 10px 0;
    box-shadow: 0px 5px 10px rgba(0, 0, 0, 0.2);
    transition: all 0.3s ease-in-out;
}

button:hover {
    background-color: #0056b3;
}

button:disabled {
    background-color: #444;
    cursor: not-allowed;
}

/* Host page styles */
#hostPage {
    background-color: #f7e9a0;
    border-radius: 15px;
    box-shadow: 0px 10px 20px rgba(0, 0, 0, 0.25);
    padding: 20px;
}

/* Waiting page */
#waitingPage {
    background: linear-gradient(to bottom, #89cff0, #add8e6);
    color: #000;
}

#waitingPage h1 {
    font-size: 24px;
    text-align: center;
    color: #333;
}

#waitingPage h1::before {
    content: "☁️ ";
}

#buzzPage {
    background: linear-gradient(to bottom, #fa8072, #f08080);
    border-radius: 15px;
}

/* Result page */
#resultPage {
    background-color: #b0e57c;
    color: #111;
}

/* Game code and list */
#gameCode {
    font-weight: bold;
    font-size: 1.5em;
    color: #444;
}

#playerList {
    background: rgba(255, 255, 255, 0.2);
    border-radius: 10px;
    padding: 15px;
    width: 80%;
}

#buzzOrder {
    font-size: 1.2em;
    list-style-type: none;
}

#buzzOrder li {
    padding: 10px;
    background-color: rgba(0, 0, 0, 0.1);
    border-radius: 5px;
    margin: 5px 0;
}

/* Header styling */
h1 {
    font-size: 36px;
    margin-bottom: 20px;
    text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.5);
}

/* For mobile view */
@media screen and (max-width: 768px) {
    button {
        font-size: 14px;
        padding: 10px 20px;
    }

    h1 {
        font-size: 28px;
    }

    #buzzOrder li {
        font-size: 1em;
    }
}

    </style>
     <script>
        // Add this function at the start of your script
        // function getWebSocketUrl() {
        //     const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        //     return `${protocol}//${window.location.hostname}:8080`;
        // }

        function getWebSocketUrl() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            return `${protocol}//buzzer-lgx8.onrender.com`;
        }
    </script>
</head>
<body>
    <div id="homePage" class="page active">
        <h1>Welcome to Real-Time Buzzer</h1>
        <button id="hostButton">Host a Game</button>
        <button id="joinButton">Join a Game</button>
    </div>

    <div id="hostPage" class="page">
        <h1>Host a Game</h1>
        <p>Your game code: <span id="gameCode"></span></p>
        <div id="playerList">
            <h3>Players (<span id="playerCount">0</span>):</h3>
            <ul id="connectedPlayers"></ul>
        </div>
        <button id="startRoundButton">Start a Buzzing Round</button>
    </div>

    <div id="joinPage" class="page">
        <h1>Join a Game</h1>
        <input id="gameCodeInput" type="text" placeholder="Enter Game Code" />
        <input id="playerNameInput" type="text" placeholder="Enter Your Name" />
        <button id="joinGameButton">Join Game</button>
    </div>

    <div id="waitingPage" class="page">
        <h1>Waiting for Host...</h1>
    </div>

    <div id="buzzPage" class="page">
        <h1>Buzz In!</h1>
        <div id="buzzStatus" style="display: none;">
            <h3>Buzz Status: <span id="buzzCounter">0</span> of <span id="totalPlayers">0</span> players</h3>
            <h4>Buzz Order:</h4>
            <ul id="buzzOrder"></ul>
        </div>
        <button id="buzzButton" style="display: none;">Buzz!</button>
    </div>

    <div id="resultPage" class="page">
        <h1>Results</h1>
        <ul id="resultsList"></ul>
    </div>

    <script>
        // const ws = new WebSocket('ws://localhost:8080');
        const ws = new WebSocket(getWebSocketUrl());
        let gameCode = '';
        let isHost = false;
        let playerName = '';

        // Page Elements
        const pages = {
            home: document.getElementById('homePage'),
            host: document.getElementById('hostPage'),
            join: document.getElementById('joinPage'),
            waiting: document.getElementById('waitingPage'),
            buzz: document.getElementById('buzzPage'),
            result: document.getElementById('resultPage')
        };

        const switchPage = (page) => {
            Object.values(pages).forEach(p => p.classList.remove('active'));
            pages[page].classList.add('active');
        };

        // Home Page
        document.getElementById('hostButton').addEventListener('click', () => {
            isHost = true;
            gameCode = Math.random().toString(36).substr(2, 6).toUpperCase();
            document.getElementById('gameCode').textContent = gameCode;
            ws.send(JSON.stringify({ type: 'host', gameCode }));
            switchPage('host');
        });

        document.getElementById('joinButton').addEventListener('click', () => {
            switchPage('join');
        });

        // Join Page
        document.getElementById('joinGameButton').addEventListener('click', () => {
            gameCode = document.getElementById('gameCodeInput').value;
            playerName = document.getElementById('playerNameInput').value;
            if (gameCode && playerName) {
                ws.send(JSON.stringify({ type: 'join', gameCode, playerName }));
                switchPage('waiting');
            }
        });

        // Host Page
        document.getElementById('startRoundButton').addEventListener('click', () => {
            ws.send(JSON.stringify({ type: 'start', gameCode }));
            switchPage('buzz');
            // Show appropriate elements based on host status
            document.getElementById('buzzStatus').style.display = isHost ? 'block' : 'none';
            document.getElementById('buzzButton').style.display = isHost ? 'none' : 'block';
            // Update total players count
            if (isHost) {
                const playerCount = document.getElementById('playerCount').textContent;
                document.getElementById('totalPlayers').textContent = playerCount;
            }
        });

        // Buzz Page
        document.getElementById('buzzButton').addEventListener('click', () => {
            ws.send(JSON.stringify({ type: 'buzz', gameCode, playerName }));
            document.getElementById('buzzButton').disabled = true;
        });

        // Update player list
        const updatePlayerList = (players) => {
            const playerCount = document.getElementById('playerCount');
            const connectedPlayers = document.getElementById('connectedPlayers');
            
            playerCount.textContent = players.length;
            connectedPlayers.innerHTML = '';
            
            players.forEach(player => {
                const li = document.createElement('li');
                li.textContent = player;
                connectedPlayers.appendChild(li);
            });
        };

        // Update buzz status
        const updateBuzzStatus = (buzzedPlayers, totalPlayers) => {
            const buzzCounter = document.getElementById('buzzCounter');
            const buzzOrder = document.getElementById('buzzOrder');
            
            buzzCounter.textContent = buzzedPlayers.length;
            buzzOrder.innerHTML = '';
            
            buzzedPlayers.forEach((player, index) => {
                const li = document.createElement('li');
                li.textContent = `${index + 1}. ${player}`;
                buzzOrder.appendChild(li);
            });
        };

        // WebSocket Events
        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);

            if (data.type === 'playerUpdate' && isHost) {
                updatePlayerList(data.players);
            } else if (data.type === 'start') {
                switchPage('buzz');
                // Show appropriate elements based on host status
                document.getElementById('buzzStatus').style.display = isHost ? 'block' : 'none';
                document.getElementById('buzzButton').style.display = isHost ? 'none' : 'block';
                // Reset buzz status for host
                if (isHost) {
                    updateBuzzStatus([], document.getElementById('playerCount').textContent);
                }
            } else if (data.type === 'buzzUpdate' && isHost) {
                updateBuzzStatus(data.buzzedPlayers, data.totalPlayers);
            } else if (data.type === 'results') {
                const resultsList = document.getElementById('resultsList');
                resultsList.innerHTML = '';
                data.results.forEach((result, index) => {
                    const li = document.createElement('li');
                    li.textContent = `${index + 1}. ${result}`;
                    resultsList.appendChild(li);
                });
                switchPage('result');
            }
        };
    </script>
</body>
</html>
