<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Buzzer App</title>
    <style>
        .page { display: none; }
        .page.active { display: block; }
        #playerList {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div id="homePage" class="page active">
        <h1>Welcome to Real-Time Buzzer</h1>
        <button id="hostButton">Host a Game</button>
        <button id="joinButton">Join a Game</button>
    </div>

    <div id="hostPage" class="page">
        <h1>Host a Game</h1>
        <p>Your game code: <span id="gameCode"></span></p>
        <div id="playerList">
            <h3>Players (<span id="playerCount">0</span>):</h3>
            <ul id="connectedPlayers"></ul>
        </div>
        <button id="startRoundButton">Start a Buzzing Round</button>
    </div>

    <div id="joinPage" class="page">
        <h1>Join a Game</h1>
        <input id="gameCodeInput" type="text" placeholder="Enter Game Code" />
        <input id="playerNameInput" type="text" placeholder="Enter Your Name" />
        <button id="joinGameButton">Join Game</button>
    </div>

    <div id="waitingPage" class="page">
        <h1>Waiting for Host...</h1>
    </div>

    <div id="buzzPage" class="page">
        <h1>Buzz In!</h1>
        <button id="buzzButton">Buzz!</button>
    </div>

    <div id="resultPage" class="page">
        <h1>Results</h1>
        <ul id="resultsList"></ul>
    </div>

    <script>
        const ws = new WebSocket('ws://localhost:8080');
        let gameCode = '';
        let isHost = false;
        let playerName = '';

        // Page Elements
        const pages = {
            home: document.getElementById('homePage'),
            host: document.getElementById('hostPage'),
            join: document.getElementById('joinPage'),
            waiting: document.getElementById('waitingPage'),
            buzz: document.getElementById('buzzPage'),
            result: document.getElementById('resultPage')
        };

        const switchPage = (page) => {
            Object.values(pages).forEach(p => p.classList.remove('active'));
            pages[page].classList.add('active');
        };

        // Home Page
        document.getElementById('hostButton').addEventListener('click', () => {
            isHost = true;
            gameCode = Math.random().toString(36).substr(2, 6).toUpperCase();
            document.getElementById('gameCode').textContent = gameCode;
            ws.send(JSON.stringify({ type: 'host', gameCode }));
            switchPage('host');
        });

        document.getElementById('joinButton').addEventListener('click', () => {
            switchPage('join');
        });

        // Join Page
        document.getElementById('joinGameButton').addEventListener('click', () => {
            gameCode = document.getElementById('gameCodeInput').value;
            playerName = document.getElementById('playerNameInput').value;
            if (gameCode && playerName) {
                ws.send(JSON.stringify({ type: 'join', gameCode, playerName }));
                switchPage('waiting');
            }
        });

        // Host Page
        document.getElementById('startRoundButton').addEventListener('click', () => {
            ws.send(JSON.stringify({ type: 'start', gameCode }));
            switchPage('buzz');
        });

        // Buzz Page
        document.getElementById('buzzButton').addEventListener('click', () => {
            ws.send(JSON.stringify({ type: 'buzz', gameCode, playerName }));
        });

        // Update player list
        const updatePlayerList = (players) => {
            const playerCount = document.getElementById('playerCount');
            const connectedPlayers = document.getElementById('connectedPlayers');
            
            playerCount.textContent = players.length;
            connectedPlayers.innerHTML = '';
            
            players.forEach(player => {
                const li = document.createElement('li');
                li.textContent = player;
                connectedPlayers.appendChild(li);
            });
        };

        // WebSocket Events
        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);

            if (data.type === 'playerUpdate' && isHost) {
                updatePlayerList(data.players);
            } else if (data.type === 'start') {
                switchPage('buzz');
            } else if (data.type === 'results') {
                const resultsList = document.getElementById('resultsList');
                resultsList.innerHTML = '';
                data.results.forEach((result, index) => {
                    const li = document.createElement('li');
                    li.textContent = `${index + 1}. ${result}`;
                    resultsList.appendChild(li);
                });
                switchPage('result');
            }
        };
    </script>
</body>
</html>
