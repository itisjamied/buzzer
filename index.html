<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Buzzer App</title>
</head>
<body>
    <h1>Real-Time Buzzer</h1>
    <button id="buzzButton">Buzz!</button>
    <ul id="events"></ul>

    <script>
        const ws = new WebSocket('ws://localhost:8080');
        const button = document.getElementById('buzzButton');
        const eventsList = document.getElementById('events');

        ws.onopen = () => {
            console.log('Connected to WebSocket server');
        };

        ws.onmessage = (event) => {
            const li = document.createElement('li');
            li.textContent = event.data;
            eventsList.appendChild(li);
        };

        ws.onclose = () => {
            console.log('Disconnected from WebSocket server');
        };

        button.addEventListener('click', () => {
            const userName = prompt('Enter your name:', 'Player');
            if (userName) {
                const message = `${userName} buzzed!`;
                ws.send(message);
            }
        });
    </script>
</body>
</html>
